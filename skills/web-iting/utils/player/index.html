<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>web-iting · 播放验证</title
  ><link rel="stylesheet" href="style.css" />
  <main>
    <header>
      <span>WEB-ITING / 本地播放验证</span>
      <h1 id="title">正在读取媒体…</h1>
      <p>画面与配音同步播放，直接检查音轨和字幕。</p>
    </header>
    <section class="screen">
      <video id="video" controls playsinline muted preload="metadata"></video
      ><audio id="audio" preload="auto"></audio>
    </section>
    <section class="controls">
      <label>音轨<select id="voices" aria-label="音轨"></select></label
      ><label>字幕<select id="subs" aria-label="字幕"></select></label
      ><label
        >整体播放速度<select id="rate">
          <option>1</option>
          <option>1.25</option>
          <option>1.5</option>
          <option>2</option>
        </select></label
      ><label
        >音量<input
          id="volume"
          aria-label="音量"
          type="range"
          min="0"
          max="1"
          value="1"
          step="0.05"
      /></label>
    </section>
    <p id="status" role="status">正在准备</p>
    <p class="note">
      这里的整体播放速度同时改变画面和音频。中文配音制作时的分段调速已包含在音轨中。浏览器验证不代表每个外部播放器都能正确显示内嵌轨道名称。
    </p>
  </main>
  <script type="module" src="player.js"></script>
</html>
